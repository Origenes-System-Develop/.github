<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Learn. Build. Pass on.">
  <defs>
    <pattern id="hatchB" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#4493f8" stroke-width="2.5"/></pattern>
    <pattern id="hatchL" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#79c0ff" stroke-width="2.5"/></pattern>
    <pattern id="dots" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="5.5" cy="5.5" r="1.5" fill="#4493f8" fill-opacity="0.75"/></pattern>
    <pattern id="stripes" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="3" fill="#79c0ff"/></pattern>
  </defs>
  <rect width="1280" height="440" rx="24" fill="#0d1117"/>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="80" y="115" font-size="68" font-weight="700" fill="#4493f8">Learn.</text>
    <text x="80" y="185" font-size="68" font-weight="700" fill="#4493f8">Build.</text>
    <text x="80" y="255" font-size="68" font-weight="700" fill="#4493f8">Pass on.</text>
    <text x="80" y="315" font-size="20" fill="#e6edf3">Every class builds a real system, documents it,</text>
    <text x="80" y="341" font-size="20" fill="#e6edf3">and hands it on. The next one studies it, reuses</text>
    <text x="80" y="367" font-size="20" fill="#e6edf3">it and goes further. The ring never closes.</text>
  </g>
  <circle cx="844" cy="64" r="42" fill="url(#hatchB)" stroke="#4493f8" stroke-width="2"/>
  <rect x="904" y="20" width="88" height="88" fill="url(#dots)"/>
  <rect x="1008" y="20" width="88" height="88" fill="#1f6feb"/>
