  <rect x="1112" y="124" width="88" height="88" fill="#79c0ff"/>
  <rect x="800" y="228" width="88" height="88" fill="url(#dots)"/>
  <circle cx="948" cy="272" r="42" fill="none" stroke="#6e7681" stroke-width="2"/>
  <circle cx="1156" cy="272" r="42" fill="url(#hatchL)" stroke="#79c0ff" stroke-width="2"/>
  <rect x="800" y="332" width="88" height="88" fill="url(#stripes)"/>
  <circle cx="948" cy="376" r="44" fill="#79c0ff"/>
